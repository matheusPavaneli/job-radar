schema @link(url: "https://specs.apollo.dev/link/v1.0") @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION) {
  query: Query
  mutation: Mutation
}

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__field(
  graph: join__Graph
  requires: join__FieldSet
  provides: join__FieldSet
  type: String
  external: Boolean
  override: String
  usedOverridden: Boolean
  overrideLabel: String
  contextArguments: [join__ContextArgument!]
) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(
  graph: join__Graph!
  key: join__FieldSet
  extension: Boolean! = false
  resolvable: Boolean! = true
  isInterfaceObject: Boolean! = false
) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

scalar join__FieldSet

scalar join__FieldValue

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY
  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

enum join__Graph {
  JOBS @join__graph(name: "jobs", url: "env:JOBS_SUBGRAPH_URL")
  MATCHING @join__graph(name: "matching", url: "env:MATCHING_SUBGRAPH_URL")
}

scalar DateTime @join__type(graph: JOBS) @join__type(graph: MATCHING)

type Query @join__type(graph: JOBS) @join__type(graph: MATCHING) {
  job(id: ID!): Job @join__field(graph: JOBS)
  """
  Newest first. Cursor-paginated; `first` is capped at 50.
  """
  jobs(first: Int = 20, after: String, filter: JobFilter): JobConnection! @join__field(graph: JOBS)
  """
  Precomputed matches for the signed-in user, best first.
  """
  myMatches(first: Int = 20): [Match!]! @join__field(graph: MATCHING)
  myResume: Resume @join__field(graph: MATCHING)
  """
  Semantic search over the catalogue. Requires sign-in (rate-limited).
  """
  semanticSearch(query: String!, first: Int = 20): [Match!]! @join__field(graph: MATCHING)
}

"""
Owned by the jobs subgraph; this subgraph only references it by id.
"""
type Job @join__type(graph: JOBS, key: "id") @join__type(graph: MATCHING, key: "id", resolvable: false) {
  id: ID!
  title: String! @join__field(graph: JOBS)
  company: String! @join__field(graph: JOBS)
  url: String! @join__field(graph: JOBS)
  location: String @join__field(graph: JOBS)
  tags: [String!]! @join__field(graph: JOBS)
  description: String! @join__field(graph: JOBS)
  publishedAt: DateTime! @join__field(graph: JOBS)
}

type JobConnection @join__type(graph: JOBS) {
  edges: [JobEdge!]!
  pageInfo: PageInfo!
}

type JobEdge @join__type(graph: JOBS) {
  cursor: String!
  node: Job!
}

type PageInfo @join__type(graph: JOBS) {
  hasNextPage: Boolean!
  endCursor: String
}

type Match @join__type(graph: MATCHING) {
  job: Job!
  """
  Cosine similarity between the resume and the job, 0..1.
  """
  score: Float!
}

type Resume @join__type(graph: MATCHING) {
  contentHash: String!
  updatedAt: DateTime!
}

type Mutation @join__type(graph: MATCHING) {
  """
  Stores the resume after PII redaction. The raw text is never persisted.
  """
  upsertResume(text: String!): Resume!
  """
  Deletes every row owned by the signed-in user.
  """
  deleteMyData: Boolean!
}

input JobFilter @join__type(graph: JOBS) {
  """
  Full-text search over title, company and description.
  """
  text: String
  """
  Matches jobs carrying every tag listed.
  """
  tags: [String!]
}