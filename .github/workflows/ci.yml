name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_radar"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/job_radar
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Supergraph is composed and committed
        run: |
          pnpm run compose
          git diff --exit-code apps/gateway/supergraph.graphql docs/public-schema.graphql

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_radar"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/job_radar
    defaults:
      run:
        working-directory: services/matching
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm run db:migrate
        working-directory: .
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
