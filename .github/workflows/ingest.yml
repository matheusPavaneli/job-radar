name: ingest

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  remotive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    defaults:
      run:
        working-directory: services/matching
    steps:
      - name: Skip without a database
        if: env.DATABASE_URL == ''
        working-directory: .
        run: echo "::notice::DATABASE_URL secret is not set; skipping ingestion"
      - uses: actions/checkout@v7
        if: env.DATABASE_URL != ''
      - uses: astral-sh/setup-uv@v10
        if: env.DATABASE_URL != ''
        with:
          enable-cache: true
      - uses: actions/cache@v6
        if: env.DATABASE_URL != ''
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-bge-small-en-v1.5
      - if: env.DATABASE_URL != ''
        run: uv sync --frozen --no-dev
      - if: env.DATABASE_URL != ''
        run: uv run --frozen --no-dev python -m matching.ingest
